[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-app-agent"
version = "0.1.0"
description = "Standalone Google Play category research with a ranked top-five app list"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-play-scraper==1.2.7",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
app-market = "app_market.cli:main"

[tool.setuptools.packages.find]
include = ["app_market*"]
